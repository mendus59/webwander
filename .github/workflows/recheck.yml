name: Recheck sites

# Re-fetches every approved/proposed site and moves any that are now spam or
# insecure (no https, invalid/expired certificate, http downgrade, outdated TLS,
# crypto-miner) to "rejected". Sites that are only temporarily unreachable are kept.
on:
  schedule:
    - cron: "41 14 * * 0"   # Sundays 14:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt
      - name: Recheck
        working-directory: crawler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m wander recheck

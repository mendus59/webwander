name: Screenshots

# Takes screenshots of approved sites for the "card" view of saved sites. Sites
# people have saved go first. Pictures live on the `screenshots` branch (one
# commit, replaced each run, so the repo doesn't grow) and the Pages deploy copies
# them into site/shots/. Mature sites are never captured. Pages that stay blank
# after waiting for their content get no picture; the site shows the page's own
# preview image or a generated preview card instead.
on:
  schedule:
    - cron: "5 15 * * *"   # daily, after the crawl
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum sites to capture this run"
        default: "120"
      force:
        description: "Recapture sites that already have a screenshot"
        type: boolean
        default: false

permissions:
  contents: write   # pushes the screenshots branch
  actions: write    # starts the Pages deploy

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements-shots.txt
      - run: pip install -r crawler/requirements-shots.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check out the screenshots branch
        run: |
          if git ls-remote --exit-code --heads origin screenshots; then
            git fetch --depth 1 origin screenshots
            git worktree add shots FETCH_HEAD
          else
            git worktree add --detach shots
            git -C shots checkout --orphan screenshots-new
            git -C shots rm -rfq .
          fi
      - name: Capture
        working-directory: crawler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: >
          python -m wander shots --out ../shots
          --limit "${{ inputs.limit || '120' }}"
          ${{ inputs.force && '--force' || '' }}
      - name: Publish
        id: publish
        working-directory: shots
        run: |
          git config user.name "webwander-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Keep the branch at a single commit so old pictures don't pile up in history.
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "screenshots: $(date -u +%F)")
          git push --force origin "$commit:refs/heads/screenshots"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy site
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

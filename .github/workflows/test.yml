name: Tests

on:
  push:
    branches: [main]
    paths: ["crawler/**", "site/data/**", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements-shots.txt
      - run: pip install -r crawler/requirements-shots.txt
      - run: python -m playwright install --with-deps chromium   # screenshot tests use a real browser
      - run: python -m pytest -q
        working-directory: crawler

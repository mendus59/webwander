name: Seed database

# Run once after setting up Firebase: scores every URL in crawler/seeds.txt and
# writes it to Firestore, so the site has something to show on day one.
on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Approve seeds immediately (uncheck to send them to the review queue)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt
      - name: Seed
        working-directory: crawler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m wander seed ${{ inputs.approve && '--approve' || '' }}
      - name: Commit crawl bookkeeping
        run: |
          git config user.name "webwander-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "seed: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

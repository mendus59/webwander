name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", ".github/scripts/stamp-build.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add page screenshots
        run: |
          # Screenshots for the saved-sites card view live on their own branch
          # (see screenshots.yml). Without them the site falls back to preview cards.
          if git ls-remote --exit-code --heads origin screenshots; then
            git fetch --depth 1 origin screenshots
            mkdir -p site/shots
            git archive FETCH_HEAD | tar -x -C site/shots
          fi
      - name: Stamp build into file URLs
        # New HTML must never run with old cached JS after a deploy.
        run: .github/scripts/stamp-build.sh site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
